<style>
:root{--navy:#1e293b;--blue:#0284c7;--red:#ff003c;--yellow:#fbbf24;--eva-green:#84cc16;--sq:min(100dvw,100dvh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;height:100dvh;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;

/* 強制 1:1 正方形顯示區域：永遠以較短邊為基準，無論 16:9 / 9:16 / 其他比例 */
.container{
  width:var(--sq);height:var(--sq);

}
header{display:flex;justify-content:space-between;align-items:center;gap:4px;flex:0 0 auto;border-bottom:1.5px solid #cbd5e1;padding:0 0 3px;margin:2px 0 3px;min-width:0}
.header-left{display:flex;align-items:center;gap:clamp(4px,1.5%,12px);min-width:0}
h1{font-size:clamp(.7rem,2.2%,1.05rem);color:#0f172a;font-weight:800;white-space:nowrap}
.date-summary{display:flex;align-items:center;gap:4px;color:#334155;font-size:clamp(.62rem,1.6%,.88rem);font-weight:700;white-space:nowrap}
.time-clock{background:#1e293b;color:#38bdf8;padding:1px 6px;border-radius:3px;font-family:monospace;font-weight:900;letter-spacing:0.5px;box-shadow:inset 0 0 3px rgba(0,0,0,0.5);cursor:pointer;transition:all 0.2s}
.time-clock:hover{background:#0284c7;color:#fff}
.time-clock.is-simulated{background:#b91c1c;color:#fef08a;animation:pulseSim 1.5s infinite}
@keyframes pulseSim{0%,100%{opacity:1}50%{opacity:0.7}}
.header-controls{display:flex;align-items:center;justify-content:flex-end;gap:clamp(3px,.8%,8px);min-width:0}
.date-picker-wrapper{display:flex;align-items:center;gap:3px;font-size:clamp(.58rem,1.4%,.78rem);font-weight:700;white-space:nowrap}
.date-picker-wrapper input{width:clamp(100px,14%,140px);padding:2px 4px;border:1px solid #cbd5e1;border-radius:3px;background:#fff;font:inherit}
#main-layout{flex:1 1 auto;min-height:0;min-width:0;width:100%;display:flex;flex-direction:row;gap:4px;overflow:hidden}
.marquee-wrapper{display:none;flex:0 0 auto;overflow:hidden;white-space:nowrap;width:100%;padding:3px 0;font-weight:900;font-size:clamp(.65rem,1.7%,.95rem);line-height:1.15;letter-spacing:0.5px;position:relative;z-index:20}
.marquee-content{display:inline-flex;white-space:nowrap;width:max-content}
.marquee-ltr .marquee-content{animation:marqueeLTR 16s linear infinite}
@keyframes marqueeLTR{0%{transform:translateX(-50%)}100%{transform:translateX(0%)}}
.marquee-rtl .marquee-content{animation:marqueeRTL 16s linear infinite}
@keyframes marqueeRTL{0%{transform:translateX(0%)}100%{transform:translateX(-50%)}}
.marquee-wrapper.phase-1{background:#0a0a0a;color:#ff003c;border-top:2px solid #ff003c;border-bottom:2px solid #ff003c;background-image:repeating-linear-gradient(45deg,rgba(255,0,60,0.25) 0,rgba(255,0,60,0.25) 12px,rgba(0,0,0,0.9) 12px,rgba(0,0,0,0.9) 24px);box-shadow:0 0 10px #ff003c,inset 0 0 6px #ff003c}
.marquee-wrapper.phase-2{background:#110005;color:#fff;border-top:2px solid #fbbf24;border-bottom:2px solid #fbbf24;background-image:repeating-linear-gradient(-45deg,rgba(255,0,60,0.85) 0,rgba(255,0,60,0.85) 15px,rgba(0,0,0,0.9) 15px,rgba(0,0,0,0.9) 30px);text-shadow:0 0 6px #000,0 0 8px #fbbf24;animation:evaBannerFlash 0.25s infinite alternate}
@keyframes evaBannerFlash{0%{border-color:#fbbf24;box-shadow:0 0 12px #ff003c,inset 0 0 8px #fbbf24}100%{border-color:#fff;box-shadow:0 0 25px #ff003c,0 0 15px #ff0,inset 0 0 20px #ff003c}}
body.emergency-critical .container{animation:screenCriticalFlash 0.25s infinite alternate!important}
@keyframes screenCriticalFlash{0%{box-shadow:inset 0 0 30px rgba(255,0,60,0.8);border:3px solid rgba(255,0,60,0.9);background-color:rgba(255,0,60,0.05)}50%{box-shadow:inset 0 0 70px rgba(255,0,60,1),inset 0 0 110px rgba(251,191,36,0.85);background-color:rgba(255,0,60,0.22)}100%{box-shadow:inset 0 0 45px rgba(255,0,60,0.9);border:3px solid rgba(251,191,36,1);background-color:rgba(255,0,60,0.08)}}
.eva-panel{display:none;flex:1 1 68%;background:#050505;border:3px solid var(--eva-green);border-radius:3px;position:relative;overflow:hidden;padding:2px;flex-direction:column;justify-content:space-between;box-shadow:0 0 15px rgba(132,204,22,0.3),inset 0 0 15px rgba(0,0,0,0.9);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;transition:all 0.3s ease;min-width:0;min-height:0}
.eva-header-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#84cc16 0%,#4d7c0f 100%);color:#000;padding:1px 4px;font-weight:900;font-size:clamp(.55rem,1.3%,.82rem);letter-spacing:0.5px;white-space:nowrap;overflow:hidden;flex:0 0 auto}
.eva-timer-main{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;padding:1px 3px;background:radial-gradient(circle,rgba(25,25,25,1) 0%,rgba(5,5,5,1) 100%);border:2px solid #3f6212;margin:1px 0;position:relative;border-left:5px solid #f97316;min-width:0;overflow:hidden;flex:1 1 auto}
.eva-timer-title{color:#f97316;font-size:clamp(.65rem,1.5%,1.05rem);font-weight:900;letter-spacing:0.5px;display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden;flex:0 0 auto;justify-content:flex-start;text-align:left;padding-left:2px}
.eva-timer-digits{font-family:'Courier New',Courier,monospace;font-size:clamp(2.2rem,8.5%,5.5rem);font-weight:900;color:#ff3300;text-shadow:0 0 10px #ff3300,0 0 20px #f60;line-height:0.9;letter-spacing:1px;margin:0;white-space:nowrap;overflow:hidden;flex:1 1 auto;display:flex;align-items:center;justify-content:center}
.eva-target-class{font-size:clamp(1rem,2.6%,1.8rem);font-weight:900;padding:1px 4px;border-radius:3px;border:1px solid rgba(251,191,36,0.4);white-space:nowrap;overflow:hidden;transition:color 0.3s,background 0.3s,border-color 0.3s;flex:0 0 auto;text-align:center}
/* 頭3分鐘（>120秒）：1A 淺粉紅、1D 淺粉藍；最後2分鐘改回黃色 */
.eva-target-class.color-1a{color:#f9a8d4;background:rgba(249,168,212,0.18);border-color:rgba(249,168,212,0.5)}
.eva-target-class.color-1d{color:#93c5fd;background:rgba(147,197,253,0.18);border-color:rgba(147,197,253,0.5)}
.eva-target-class.color-yellow{color:#fbbf24;background:rgba(251,191,36,0.15);border-color:rgba(251,191,36,0.4)}
.eva-grid-container{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:1px;min-width:0;flex:0 0 auto}
.eva-box-internal{background:repeating-linear-gradient(-45deg,rgba(239,68,68,0.8) 0,rgba(239,68,68,0.8) 10px,rgba(20,0,0,0.9) 10px,rgba(20,0,0,0.9) 20px);border:2px solid #ef4444;padding:2px 4px;color:#fff;min-width:0;overflow:hidden}
.eva-box-internal .title{font-size:clamp(.75rem,1.6%,1.15rem);font-weight:900;color:#fff;text-shadow:0 0 5px #000;white-space:nowrap;overflow:hidden}
.eva-box-internal .sub{font-size:clamp(.42rem,.9%,.62rem);color:#fca5a5;letter-spacing:1px;font-weight:800;white-space:nowrap;overflow:hidden}
.eva-box-power{border:2px solid #f97316;background:#0f0f0f;padding:2px 4px;color:#f97316;min-width:0;overflow:hidden}
.eva-box-power .title{font-size:clamp(.55rem,1.1%,.8rem);font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden}
.eva-box-power .sub{font-size:clamp(.4rem,.8%,.55rem);color:#fdba74;letter-spacing:0.5px;white-space:nowrap;overflow:hidden}
.eva-status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:1px;min-width:0;flex:0 0 auto}
.eva-status-item{background:#18181b;border:1px solid #3f3f46;color:#71717a;text-align:center;padding:1px 0;font-size:clamp(.42rem,.85%,.62rem);font-weight:900;transition:all 0.2s;white-space:nowrap;overflow:hidden}
.eva-status-item.active-normal{background:#dc2626;color:#fff;border-color:#f87171;box-shadow:0 0 8px #dc2626;animation:pulseRacing .6s infinite alternate}
.eva-status-item.active-racing{background:#dc2626;color:#fff;border-color:#f87171;box-shadow:0 0 8px #dc2626;animation:pulseRacing .6s infinite alternate}
@keyframes pulseRacing{0%{opacity:.5}100%{opacity:1}}
.eva-panel.critical-mode{border-color:#ff003c!important;background:radial-gradient(circle,#38000a 0%,#080003 100%)!important;box-shadow:0 0 28px #ff003c,inset 0 0 25px rgba(255,0,60,.8)!important;animation:evaPanelPulse .3s infinite alternate!important}
@keyframes evaPanelPulse{0%{border-color:#ff003c;box-shadow:0 0 20px #ff003c,inset 0 0 15px #ff003c}100%{border-color:#fff;box-shadow:0 0 40px #ff003c,0 0 20px #ff0,inset 0 0 30px #ff003c}}
.eva-panel.critical-mode .eva-header-bar{background:#ff003c!important;color:#fff!important;box-shadow:0 0 10px #ff003c}
.eva-panel.critical-mode .eva-timer-main{background:radial-gradient(circle,rgba(60,0,15,1) 0%,rgba(10,0,3,1) 100%)!important;border-color:#ff003c!important;border-left-color:#ff003c!important}
.eva-panel.critical-mode .eva-timer-title{color:#ff003c!important;text-shadow:0 0 6px #ff003c}
.eva-panel.critical-mode .eva-timer-digits{color:#ff3300!important;text-shadow:0 0 15px #ff003c,0 0 30px red,0 0 40px #f60!important}
.eva-panel.critical-mode .eva-target-class{color:#fff!important;background:rgba(255,0,60,.3)!important;border-color:#ff003c!important}
.eva-panel.critical-mode .eva-box-internal{background:repeating-linear-gradient(-45deg,rgba(255,0,60,.95) 0,rgba(255,0,60,.95) 12px,rgba(20,0,5,.95) 12px,rgba(20,0,5,.95) 24px)!important;border-color:#ff003c!important;box-shadow:0 0 10px rgba(255,0,60,.6)!important}
.eva-panel.critical-mode .eva-box-power{border-color:#ff003c!important;color:#ff003c!important;background:#1a0005!important}
/* 警告時表格只剩時間欄 + 今日欄，擠到最右 */
#table-container{flex:1 1 auto;min-height:0;min-width:0;width:100%;overflow:hidden;display:flex}
#table-container.warning-mode{flex:0 0 32%;max-width:32%}
table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:1.05}
col.time-column{width:42%}col.day-column{width:58%}
th,td{border:1px solid #94a3b8;padding:1px 2px;text-align:center;vertical-align:middle;overflow:hidden;white-space:nowrap;line-height:1.05}
th{background:var(--navy);color:#fff;font-weight:700}
.group-th-bg{background:var(--blue)!important;color:#fff!important;font-weight:800!important}
.group-bg{background:#f8fafc;font-weight:700}
.group-col-left{border-left:2.5px solid var(--blue)!important}
.group-col-right{border-right:2.5px solid var(--blue)!important}
.group-col-top{border-top:2.5px solid var(--blue)!important}
.group-col-bottom{border-bottom:2.5px solid var(--blue)!important}
.time-col{background:#e2e8f0;font-weight:800;text-align:center}
.free-slot{background:#fff!important;color:transparent!important}
.active-class{background:#fde047!important;color:#0f172a;font-weight:700;cursor:pointer}
.active-class.class-1a{background:#fbcfe8!important}
.active-class.class-1d{background:#bfdbfe!important}
/* 當刻課堂：淺綠漸變 */
.current-live-cell{
background:linear-gradient(135deg,#bbf7d0 0%,#86efac 50%,#4ade80 100%)!important;
color:#14532d!important;
font-weight:900!important;
position:relative;
z-index:5;
animation:liveGreenGlow 2s ease-in-out infinite;
}
@keyframes liveGreenGlow{
0%,100%{box-shadow:inset 0 0 5px rgba(34,197,94,.4)}
50%{box-shadow:inset 0 0 12px rgba(34,197,94,.85)}
}
.live-slot-left{border-top:2.5px solid #16a34a!important;border-bottom:2.5px solid #16a34a!important;border-left:2.5px solid #16a34a!important}
.live-slot-right{border-top:2.5px solid #16a34a!important;border-bottom:2.5px solid #16a34a!important;border-right:2.5px solid #16a34a!important}
/* 5分鐘倒數：淺紅色漸變 + 持續閃爍 */
.is-approaching{
background:linear-gradient(135deg,#fecaca 0%,#fca5a5 40%,#f87171 100%)!important;
color:#7f1d1d!important;
font-weight:900!important;
position:relative;
animation:approachFlash 0.55s ease-in-out infinite alternate!important;
border:2.5px solid #ef4444!important;
}
@keyframes approachFlash{
0%{box-shadow:0 0 6px #f87171,inset 0 0 5px #fee2e2;filter:brightness(1)}
100%{box-shadow:0 0 18px #ef4444,0 0 25px #fbbf24,inset 0 0 10px #fecaca;filter:brightness(1.15)}
}
.approach-slot-left{border-top:2.5px solid #ef4444!important;border-bottom:2.5px solid #ef4444!important;border-left:2.5px solid #ef4444!important}
.approach-slot-right{border-top:2.5px solid #ef4444!important;border-bottom:2.5px solid #ef4444!important;border-right:2.5px solid #ef4444!important}
.manually-hidden{background:#fff!important;color:transparent!important;box-shadow:none!important;cursor:pointer}
/* 小螢幕微調（仍保持 1:1 正方形） */
@media(max-width:640px){
  header{gap:3px;padding-bottom:2px;margin-bottom:2px}
  .header-left{gap:4px}
  h1{font-size:clamp(.65rem,2.8%,.88rem);line-height:1.1}
  .date-summary{font-size:clamp(.58rem,2.2%,.75rem);gap:3px}
  .header-controls{justify-content:flex-end;gap:3px}
  .date-picker-wrapper{font-size:clamp(.55rem,2.2%,.7rem);gap:2px}
  .date-picker-wrapper input{width:clamp(95px,30%,125px);padding:1px 3px}
  .marquee-wrapper{font-size:clamp(.58rem,2.5%,.78rem);padding:2px 0}
  col.time-column{width:40%}col.day-column{width:60%}
  .group-col-left{border-left-width:2px!important}
  .group-col-right{border-right-width:2px!important}
}
@media(max-height:460px){
  .container{padding-top:calc(1px + env(safe-area-inset-top));padding-bottom:calc(1px + env(safe-area-inset-bottom))}
  header{padding-bottom:1px;margin-bottom:1px}
  .header-controls{gap:3px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<header>
<div class="header-left">

<script>
const dayIndexToHeader={1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri'};
const defaultTimetable=[

['10\n15:50 - 16:25','','','','','']
];
let manuallyHiddenCells={};let clickCountMap={};let lastClickedKey=null;let clickTimeout=null;
let customTimeOffset=0;
function formatDateString(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseMin(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function getSimulatedNow(){return new Date(Date.now()+customTimeOffset)}
function isTargetChinClass(content){if(!content)return false;return (/Chin/i.test(content)&&!/Chin\s*Meeting/i.test(content))||/^1D\s*\(204\)$/i.test(content.trim())}
function getTimeSlotStatus(timeStr,targetDateStr){
const now=getSimulatedNow();
if(targetDateStr!==formatDateString(now)||!timeStr||!timeStr.includes('-'))return{isLive:false,isApproaching:false,diffMs:0,diffSec:0};
const match=timeStr.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
if(!match)return{isLive:false,isApproaching:false,diffMs:0,diffSec:0};
const startMin=parseMin(match[1]),endMin=parseMin(match[2]);
const currentMs=(now.getHours()*3600+now.getMinutes()*60+now.getSeconds())*1000+now.getMilliseconds();
const startMs=startMin*60*1000,endMs=endMin*60*1000;
const isLive=currentMs>=startMs&&currentMs<endMs;
const diffMs=startMs-currentMs,diffSec=diffMs/1000;
// 倒數期間 + 結束後 10 秒仍保持 approaching 狀態以便平滑消失
const isApproaching=diffSec<=300&&diffSec>=-10;
return{isLive,isApproaching,diffMs,diffSec};
}
function formatMMSSMS(diffMs){
if(diffMs<=0)return'00:00:00';
const m=Math.floor(diffMs/60000),s=Math.floor((diffMs%60000)/1000),ms=Math.floor((diffMs%1000)/10);
return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(ms).padStart(2,'0')}`;
}
function updateLiveClock(){
const now=getSimulatedNow();
const h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0'),s=String(now.getSeconds()).padStart(2,'0');
const clockEl=document.getElementById('current-time');
clockEl.textContent=`${h}:${m}:${s}`;
const resetBtn=document.getElementById('reset-time-btn');
if(customTimeOffset!==0){
clockEl.classList.add('is-simulated');
clockEl.title='【模擬時間中】點擊重新修改';
resetBtn.style.display='inline-block';
}else{
clockEl.classList.remove('is-simulated');
clockEl.title='點擊修改測試時間';
resetBtn.style.display='none';
}
}
function fitTable(){
const box=document.getElementById('table-container'),table=box.querySelector('table');
if(!table)return;
table.style.whiteSpace='nowrap';
let size=14;
table.style.fontSize=size+'px';
const cells=[...table.querySelectorAll('th,td')];
while(size>4.5){
const overflow=box.scrollHeight>box.clientHeight+1||box.scrollWidth>box.clientWidth+1||table.scrollHeight>box.clientHeight+1||
cells.some(c=>c.scrollHeight>c.clientHeight+2||c.scrollWidth>c.clientWidth+2);
if(!overflow)break;
size-=0.5;
table.style.fontSize=size+'px';
}
}
/* EVA 面板文字自動縮放：優先保證倒數時間（含毫秒）完整顯示，用盡警告格空間 */
function fitEvaPanel(){
const panel=document.getElementById('eva-panel');
if(!panel||panel.style.display==='none')return;
 
const timerMain=panel.querySelector('.eva-timer-main');
const digitsEl=document.getElementById('eva-timer-digits');
const targetEl=document.getElementById('eva-target-class');
const titleEl=panel.querySelector('.eva-timer-title');
const headerBar=panel.querySelector('.eva-header-bar');
const grid=panel.querySelector('.eva-grid-container');
const statusBar=panel.querySelector('.eva-status-bar');
 
if(!timerMain||!digitsEl||!targetEl)return;
 
// 基準字級大幅提高（約 3 倍），再由溢出檢測縮小到最大可顯示尺寸
const minorElements=[
{sel:'.eva-header-bar', ratio:1.65},
{sel:'.eva-timer-title', ratio:2.1},
{sel:'.eva-box-internal .title', ratio:2.55},
{sel:'.eva-box-internal .sub', ratio:1.26},
{sel:'.eva-box-power .title', ratio:1.8},
{sel:'.eva-box-power .sub', ratio:1.14},
{sel:'.eva-status-item', ratio:1.26}
];
 
const table=document.querySelector('#table-container table');
let baseSize=14;
if(table){
const fs=parseFloat(getComputedStyle(table).fontSize);
if(!isNaN(fs))baseSize=fs;
}
 
// 先套用次要文字大小（已放大約 3 倍）
minorElements.forEach(e=>{
const els=panel.querySelectorAll(e.sel);
els.forEach(el=>{el.style.fontSize=(baseSize*e.ratio)+'px';el.style.whiteSpace='nowrap';});
});
 
// 核心：digits 與 target 初始值稍為降低，確保「04:56:12」等完整時間（含毫秒）可完整顯示
// 倒數時間必須完整顯示（含毫秒 MM:SS:MS），因此 digits 縮放優先級最高
let digitsSize=baseSize*11.5;   // 原 14.4 → 稍為縮小，避免 0 / 2 被裁切
let targetSize=baseSize*4.2;    // 原 4.8 → 同步微調
let titleSize=baseSize*2.0;     // 原 2.25 → 同步微調
 
const applySizes=()=>{
digitsEl.style.fontSize=digitsSize+'px';
targetEl.style.fontSize=targetSize+'px';
if(titleEl)titleEl.style.fontSize=titleSize+'px';
};
 
// 更嚴格的溢出檢測：特別針對 digits 必須完整可見（含毫秒）
const isOverflow=()=>{
if(panel.scrollHeight>panel.clientHeight+1||panel.scrollWidth>panel.clientWidth+1)return true;
if(timerMain.scrollHeight>timerMain.clientHeight+1||timerMain.scrollWidth>timerMain.clientWidth+1)return true;
// digits 必須完整顯示，不允許任何溢出
if(digitsEl.scrollWidth>digitsEl.clientWidth+0.5||digitsEl.scrollHeight>digitsEl.clientHeight+0.5)return true;
if(targetEl.scrollWidth>targetEl.clientWidth+1||targetEl.scrollHeight>targetEl.clientHeight+1)return true;
return false;
};
 
// 先嘗試最大尺寸
applySizes();
 
// 若溢出則逐步縮小，優先保住 digits（時間含毫秒）最大且完整可見
let safety=120;
while(isOverflow()&&safety-->0){
if(digitsSize>baseSize*4.8){
// 優先縮小 digits，但保持其為最大元素
digitsSize-=0.35;
}else if(targetSize>baseSize*2.0){
targetSize-=0.22;
}else if(titleSize>baseSize*1.1){
titleSize-=0.1;
}else{
// 最後才微調次要元素
minorElements.forEach(e=>{
const els=panel.querySelectorAll(e.sel);
els.forEach(el=>{
const cur=parseFloat(el.style.fontSize)||baseSize*e.ratio;
el.style.fontSize=Math.max(cur*0.93,baseSize*0.78)+'px';
});
});
}
applySizes();
}
 
// 最後再嘗試放大一點，把上下空間用盡，但仍確保 digits 完整顯示
safety=30;
while(!isOverflow()&&safety-->0){
const prevD=digitsSize,prevT=targetSize,prevTitle=titleSize;
digitsSize+=0.25;
targetSize+=0.12;
titleSize+=0.06;
applySizes();
if(isOverflow()){
digitsSize=prevD;
targetSize=prevT;
titleSize=prevTitle;
applySizes();
break;
}
}
 
// 最終保險：若 digits 仍有任何溢出跡象，強制再縮小直到完整可見
safety=40;
while((digitsEl.scrollWidth>digitsEl.clientWidth+0.5||digitsEl.scrollHeight>digitsEl.clientHeight+0.5)&&safety-->0){
digitsSize-=0.25;
digitsEl.style.fontSize=digitsSize+'px';
}
}
function handleCellClick(key){
if(lastClickedKey!==key){clickCountMap={};lastClickedKey=key}
clickCountMap[key]=(clickCountMap[key]||0)+1;
if(clickTimeout)clearTimeout(clickTimeout);
clickTimeout=setTimeout(()=>{clickCountMap[key]=0},1500);
if(clickCountMap[key]>=3){
manuallyHiddenCells[key]=!manuallyHiddenCells[key];
clickCountMap[key]=0;
renderSchedule();
}
}
function onDateChanged(){manuallyHiddenCells={};renderSchedule()}
function updateStatusLights(diffSec){
const normalEl=document.getElementById('eva-status-normal');
const racingEl=document.getElementById('eva-status-racing');
normalEl.classList.remove('active-normal');
racingEl.classList.remove('active-racing');
if(diffSec>240){
normalEl.classList.add('active-normal');
}else if(diffSec>180){
racingEl.classList.add('active-racing');
}else if(diffSec>0){
const phase=Math.floor(Date.now()/700)%2;
if(phase===0) racingEl.classList.add('active-racing');
else normalEl.classList.add('active-normal');
}else{
racingEl.classList.add('active-racing');
}
}
function renderSchedule(){
updateLiveClock();
const dateInputVal=document.getElementById('date-select').value;
const selectedDate=dateInputVal?new Date(dateInputVal+'T00:00:00'):getSimulatedNow();
const targetDay=selectedDate.getDay(),targetHeader=dayIndexToHeader[targetDay];
const weekdays=['Mon','Tue','Wed','Thu','Fri'],targetIndex=weekdays.indexOf(targetHeader),hasTarget=targetIndex>=0;
document.getElementById('current-date').textContent=formatDateString(selectedDate);
document.getElementById('current-weekday').textContent=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][targetDay];
let approaching=null;
let approachingRowIndex=-1;
for(let i=1;i<defaultTimetable.length;i++){
const row=defaultTimetable[i],slot=row[0]||'',status=getTimeSlotStatus(slot,dateInputVal);
const content=row[defaultTimetable[0].indexOf(targetHeader)]||'';
if(hasTarget&&status.isApproaching&&content&&isTargetChinClass(content)){
if(!approaching||status.diffMs<approaching.diffMs){
approaching={name:content.replace(/\n/g,' '),diffMs:status.diffMs,diffSec:status.diffSec,slot:slot};
approachingRowIndex=i;
}
}
}
const evaPanel=document.getElementById('eva-panel'),tableContainer=document.getElementById('table-container');
let displayOrder=[];
if(approaching){
// 警告時：EVA 佔盡左方，表格只顯示「時間」+ 今日欄並擠到最右
evaPanel.style.display='flex';
evaPanel.style.order='1';
tableContainer.style.order='2';
tableContainer.classList.add('warning-mode');
displayOrder=['時間',targetHeader];
}else{
evaPanel.style.display='none';
tableContainer.classList.remove('warning-mode');
displayOrder=!hasTarget?['時間',...weekdays]:[...weekdays.slice(0,targetIndex),'時間',...weekdays.slice(targetIndex)];
}
// 保證「時間」欄永遠緊貼在當日欄左側
if(hasTarget){
const timeIndex=displayOrder.indexOf('時間');
const dayIndex=displayOrder.indexOf(targetHeader);
if(timeIndex>=0&&dayIndex>=0&&dayIndex!==timeIndex+1){
displayOrder.splice(timeIndex,1);
displayOrder.splice(displayOrder.indexOf(targetHeader),0,'時間');
}
}
let html='<table aria-label="每週課堂時間表"><colgroup><col class="time-column">'+displayOrder.slice(1).map(()=>'<col class="day-column">').join('')+'</colgroup><thead><tr>';
for(const h of displayOrder){
const isTarget=h===targetHeader,isTime=h==='時間';
let thClass='';
if(hasTarget&&isTime)thClass='group-th-bg group-col-left group-col-top';
else if(hasTarget&&isTarget)thClass='group-th-bg group-col-right group-col-top';
html+=`<th class="${thClass}">${isTarget?`${h} (今日)`:h}</th>`;
}
html+='</tr></thead><tbody>';
const totalRows=defaultTimetable.length;
for(let i=1;i<totalRows;i++){
const row=defaultTimetable[i],slot=row[0]||'',status=getTimeSlotStatus(slot,dateInputVal);
const isLastRow=i===totalRows-1;
const isLiveRow=hasTarget&&status.isLive;
// 只有真正觸發 EVA 5分鐘倒數的那一列才套用紅色漸變並持續閃爍
const isThisApproachingRow = (approaching && i === approachingRowIndex && status.diffMs > 0);
html+='<tr>';
for(const h of displayOrder){
const isTarget=h===targetHeader,isTime=h==='時間';
const content=row[defaultTimetable[0].indexOf(h)]||'';
const key=`${dateInputVal}_${i}_${h}`,hidden=!!manuallyHiddenCells[key];
const isChin=isTargetChinClass(content);
let groupClass='';
if(hasTarget){
if(isTime)groupClass=' group-bg group-col-left'+(isLastRow?' group-col-bottom':'');
else if(isTarget)groupClass=' group-bg group-col-right'+(isLastRow?' group-col-bottom':'');
}
if(isTime){
let liveTimeClass=' time-col';
if(isLiveRow) liveTimeClass=' current-live-cell live-slot-left';
else if(isThisApproachingRow) liveTimeClass=' is-approaching approach-slot-left';
html+=`<td class="${liveTimeClass}${groupClass}">${slot.replace(/\n/g,'<br>')}</td>`;
continue;
}
let stateClass='';
if(isTarget&&status.isLive){
stateClass=' current-live-cell live-slot-right';
}else if(isThisApproachingRow && isChin){
stateClass=' is-approaching approach-slot-right';
}
if(!content){
if(isTarget&&status.isLive){
html+=`<td class="current-live-cell live-slot-right${groupClass}"></td>`;
}else if(isThisApproachingRow){
html+=`<td class="is-approaching approach-slot-right${groupClass}"></td>`;
}else{
html+=`<td class="free-slot${groupClass}"></td>`;
}
}else if(hidden){
html+=`<td class="manually-hidden${groupClass}" onclick="handleCellClick('${key}')" aria-label="已隱藏的課堂，連點三次還原"></td>`;
}else{
const tintClass=/1A\s*\(201\)/i.test(content)?' class-1a':/1D\s*\(204\)/i.test(content)?' class-1d':'';
const bgClass=stateClass?'':' active-class'+tintClass;
html+=`<td class="${bgClass}${groupClass}${stateClass}" onclick="handleCellClick('${key}')" title="連點三次可隱藏或還原">${content.replace(/\n/g,'<br>')}</td>`;
}
}
html+='</tr>';
}
html+='</tbody></table>';
document.getElementById('table-container').innerHTML=html;
// 跑馬燈與 EVA 面板
const bannerTop=document.getElementById('approaching-banner-top');
const bannerBottom=document.getElementById('approaching-banner-bottom');
const topText=document.getElementById('top-marquee-text');
const bottomText=document.getElementById('bottom-marquee-text');
if(approaching){
bannerTop.style.display='block';
bannerBottom.style.display='block';
const formattedDigits=formatMMSSMS(approaching.diffMs);
document.getElementById('eva-timer-digits').textContent=formattedDigits;
const targetEl=document.getElementById('eva-target-class');
targetEl.textContent=approaching.name;
// 課堂名顏色邏輯：頭3分鐘（>120秒）依班級上色，最後2分鐘改黃色
targetEl.classList.remove('color-1a','color-1d','color-yellow');
if(approaching.diffSec>120){
if(/1A\s*\(201\)/i.test(approaching.name)) targetEl.classList.add('color-1a');
else if(/1D\s*\(204\)/i.test(approaching.name)) targetEl.classList.add('color-1d');
else targetEl.classList.add('color-yellow');
}else{
targetEl.classList.add('color-yellow');
}
updateStatusLights(approaching.diffSec);
let alertMsg='',phaseClass='';
if(approaching.diffSec>120){
document.body.classList.remove('emergency-critical');
evaPanel.classList.remove('critical-mode');
phaseClass='phase-1';
alertMsg=`緊急事態非常警報令 EMERGENCY &nbsp;&bull;&nbsp; ⚠️ 情報確認 &nbsp;&bull;&nbsp; 快將上課！[${approaching.name}] &nbsp;&bull;&nbsp; ⏱️ 倒數 ${formattedDigits} &nbsp;&bull;&nbsp; `;
}else if(approaching.diffSec>0){
document.body.classList.add('emergency-critical');
evaPanel.classList.add('critical-mode');
phaseClass='phase-2';
alertMsg=`🚨 極限警報 CRITICAL ALERT &nbsp;&bull;&nbsp; ⚠️ 非常事態 &nbsp;&bull;&nbsp; [${approaching.name}] 即將開始！ &nbsp;&bull;&nbsp; ⏱️ 倒數 ${formattedDigits} &nbsp;&bull;&nbsp; `;
}else{
document.body.classList.add('emergency-critical');
evaPanel.classList.add('critical-mode');
phaseClass='phase-2';
const postSec=(Math.abs(approaching.diffMs)/1000).toFixed(1);
alertMsg=`🚨 課堂已開始 CLASS STARTED &nbsp;&bull;&nbsp; [${approaching.name}] &nbsp;&bull;&nbsp; ⏱️ 已開始 ${postSec} 秒 &nbsp;&bull;&nbsp; `;
}
bannerTop.className=`marquee-wrapper marquee-ltr ${phaseClass}`;
bannerBottom.className=`marquee-wrapper marquee-rtl ${phaseClass}`;
const repeatedContent=`<span>${alertMsg.repeat(4)}</span><span>${alertMsg.repeat(4)}</span>`;
topText.innerHTML=repeatedContent;
bottomText.innerHTML=repeatedContent;
}else{
document.body.classList.remove('emergency-critical');
evaPanel.classList.remove('critical-mode');
bannerTop.style.display='none';
bannerBottom.style.display='none';
topText.innerHTML='';
bottomText.innerHTML='';
document.getElementById('eva-status-normal').classList.remove('active-normal');
document.getElementById('eva-status-racing').classList.remove('active-racing');
}
requestAnimationFrame(()=>{
fitTable();
fitEvaPanel();
});
}
document.getElementById('current-time').addEventListener('click',()=>{
const currentNow=getSimulatedNow();
const defaultVal=`${String(currentNow.getHours()).padStart(2,'0')}:${String(currentNow.getMinutes()).padStart(2,'0')}:${String(currentNow.getSeconds()).padStart(2,'0')}`;
const input=prompt('【測試功能】請輸入欲模擬的時間 (格式 HH:MM:SS 或 HH:MM)：\n例如輸入 14:23:10 可測試最後 2 分鐘全紅閃爍與毫秒倒數',defaultVal);
if(input!==null&&input.trim()!==''){
const parts=input.trim().split(':').map(Number);
if(parts.length>=2&&!isNaN(parts[0])&&!isNaN(parts[1])){
const h=parts[0],m=parts[1],s=parts[2]||0;
const targetDate=new Date(currentNow);
targetDate.setHours(h,m,s,0);
customTimeOffset=targetDate.getTime()-Date.now();
renderSchedule();
}else alert('時間格式不正確，請使用 HH:MM 或 HH:MM:SS');
}
});
document.getElementById('reset-time-btn').addEventListener('click',()=>{customTimeOffset=0;renderSchedule()});
function setTestWeekday(){
const dateInput=document.getElementById('date-select');
const simulatedNow=getSimulatedNow();
const selectedDate=dateInput.value?new Date(dateInput.value+'T00:00:00'):new Date(simulatedNow);
const currentDay=selectedDate.getDay();
const answer=prompt('【測試功能】請輸入要測試的星期：0=星期日、1=星期一、2=星期二、3=星期三、4=星期四、5=星期五、6=星期六；也可輸入「星期一」等。測試會同步模擬日期與時間，並觸發與實際相同的課堂預警、倒數及警報。',String(currentDay));
if(answer===null||answer.trim()==='')return;
const cleaned=answer.trim().replace(/^星期|^週/,'');
const dayMap={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
const requestedDay=/^[0-6]$/.test(cleaned)?Number(cleaned):dayMap[cleaned];
if(requestedDay===undefined){alert('輸入無效，請輸入 0 至 6，或「星期一」至「星期日」。');return;}
selectedDate.setDate(selectedDate.getDate()+requestedDay-currentDay);
selectedDate.setHours(simulatedNow.getHours(),simulatedNow.getMinutes(),simulatedNow.getSeconds(),simulatedNow.getMilliseconds());
customTimeOffset=selectedDate.getTime()-Date.now();
dateInput.value=formatDateString(selectedDate);
onDateChanged();
}
const weekdayPicker=document.getElementById('current-weekday');
weekdayPicker.addEventListener('click',setTestWeekday);
weekdayPicker.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();setTestWeekday()}});
const dateInput=document.getElementById('date-select');
dateInput.value=formatDateString(getSimulatedNow());
dateInput.addEventListener('change',onDateChanged);
renderSchedule();
setInterval(renderSchedule,30);
window.addEventListener('resize',()=>requestAnimationFrame(()=>{fitTable();fitEvaPanel();}));
if('ResizeObserver'in window){
new ResizeObserver(()=>requestAnimationFrame(()=>{fitTable();fitEvaPanel();})).observe(document.getElementById('table-container'));
new ResizeObserver(()=>requestAnimationFrame(fitEvaPanel)).observe(document.getElementById('eva-panel'));
}
</script>
